services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: deploy-main:local
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    volumes:
      - app_public_storage:/var/www/html/storage/app/public

  db:
    image: mariadb:11.8
    env_file:
      - docker/mariadb.env
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  app_public_storage:
  mariadb_data:
