name: Deploy Sistem Absensi Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sistem-absensi-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Sistem Absensi app
    runs-on: ubuntu-latest
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}

    steps:
      - name: Validate deployment configuration
        run: |
          missing=0
          if [ -z "$PRODUCTION_HOST" ]; then echo "Missing PRODUCTION_HOST"; missing=1; fi
          if [ -z "$PRODUCTION_USER" ]; then echo "Missing PRODUCTION_USER"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_PORT" ]; then echo "Missing PRODUCTION_SSH_PORT"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_KEY" ]; then echo "Missing PRODUCTION_SSH_KEY"; missing=1; fi
          if [ -z "$PRODUCTION_KNOWN_HOSTS" ]; then echo "Missing PRODUCTION_KNOWN_HOSTS"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/production" "$HOME/.ssh/known_hosts"

      - name: Deploy only the Sistem Absensi app and verify health
        run: |
          ssh \
            -i "$HOME/.ssh/production" \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          app_container_ids="$(docker ps \
            --filter label=com.docker.compose.project=followme-app \
            --filter label=com.docker.compose.service=app \
            --format '{{.ID}}')"
          if [ -z "$app_container_ids" ]; then
            echo "No running app container found for the followme-app project."
            exit 1
          fi
          if [ "$(printf '%s\n' "$app_container_ids" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one Sistem Absensi app container."
            exit 1
          fi

          app_container="$app_container_ids"
          production_dir="$(docker inspect --format='{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$app_container")"
          config_files="$(docker inspect --format='{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$app_container")"
          app_image="$(docker inspect --format='{{.Config.Image}}' "$app_container")"
          previous_image="$(docker inspect --format='{{.Image}}' "$app_container")"

          if [ -z "$production_dir" ] || [ ! -d "$production_dir" ]; then
            echo "Could not resolve the Sistem Absensi project directory from its container."
            exit 1
          fi
          if ! git -C "$production_dir" rev-parse --show-toplevel >/dev/null 2>&1; then
            echo "The Sistem Absensi project directory is not a Git checkout."
            exit 1
          fi
          production_dir="$(git -C "$production_dir" rev-parse --show-toplevel)"
          cd "$production_dir"

          if [ "$(git branch --show-current)" != "main" ]; then
            echo "Production checkout is not on branch main; refusing deployment."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Production checkout has local changes; refusing deployment."
            exit 1
          fi

          if [ -z "$config_files" ]; then
            echo "The Sistem Absensi Compose configuration could not be resolved."
            exit 1
          fi
          if [ "$app_image" != "deploy-main:local" ]; then
            echo "The running app image does not match the repository's deployment image."
            exit 1
          fi

          compose=(docker compose -p followme-app)
          IFS=',' read -r -a config_paths <<< "$config_files"
          for config_path in "${config_paths[@]}"; do
            case "$config_path" in
              "$production_dir"/*) ;;
              *)
                echo "A Compose config resolves outside the Sistem Absensi checkout."
                exit 1
                ;;
            esac
            if [ ! -f "$config_path" ]; then
              echo "A configured Sistem Absensi Compose file is missing."
              exit 1
            fi
            compose+=(-f "$config_path")
          done

          running_app="$("${compose[@]}" ps --status running -q app)"
          if [ -z "$running_app" ]; then
            echo "The existing Sistem Absensi app container is not running; refusing deployment."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null; then
            echo "The existing Sistem Absensi health check failed; refusing deployment."
            exit 1
          fi

          git fetch origin main
          git merge --ff-only origin/main

          "${compose[@]}" build app
          if ! "${compose[@]}" up -d --no-deps app; then
            docker tag "$previous_image" deploy-main:local
            "${compose[@]}" up -d --no-deps app
            echo "Deployment failed; restored the previous app image."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null; then
              echo "Sistem Absensi health check passed."
              exit 0
            fi
            sleep 2
          done

          docker tag "$previous_image" deploy-main:local
          "${compose[@]}" up -d --no-deps app
          echo "Health check failed; restored the previous app image."
          exit 1
          REMOTE
