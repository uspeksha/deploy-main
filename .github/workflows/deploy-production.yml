name: Deploy Sistem Absensi Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sistem-absensi-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Sistem Absensi app
    runs-on: ubuntu-latest
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      RELEASE_IMAGE: deploy-main:release-${{ github.sha }}
      ROLLBACK_TAG: deploy-main:rollback-${{ github.run_id }}

    steps:
      - name: Validate deployment configuration
        run: |
          missing=0
          if [ -z "$PRODUCTION_HOST" ]; then echo "Missing PRODUCTION_HOST"; missing=1; fi
          if [ -z "$PRODUCTION_USER" ]; then echo "Missing PRODUCTION_USER"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_PORT" ]; then echo "Missing PRODUCTION_SSH_PORT"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_KEY" ]; then echo "Missing PRODUCTION_SSH_KEY"; missing=1; fi
          if [ -z "$PRODUCTION_KNOWN_HOSTS" ]; then echo "Missing PRODUCTION_KNOWN_HOSTS"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out release source
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/production" "$HOME/.ssh/known_hosts"

      - name: Verify the exact production app target before building or transferring
        run: |
          ssh \
            -i "$HOME/.ssh/production" \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          app_container_ids="$(docker ps \
            --filter publish=8081 \
            --filter label=com.docker.compose.project=followme-app \
            --filter label=com.docker.compose.service=app \
            --format '{{.ID}}')"
          if [ "$(printf '%s\n' "$app_container_ids" | sed '/^$/d' | wc -l | tr -d '[:space:]')" != "1" ]; then
            echo "Expected exactly one running followme-app app container publishing port 8081; refusing deployment."
            exit 1
          fi
          app_container="$app_container_ids"
          published_port="$(docker port "$app_container" 80/tcp)"
          if [ "$published_port" != "127.0.0.1:8081" ]; then
            echo "The target app is not bound exclusively to 127.0.0.1:8081; refusing deployment."
            exit 1
          fi
          production_dir="$(docker inspect --format='{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$app_container")"
          config_files="$(docker inspect --format='{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$app_container")"
          app_image="$(docker inspect --format='{{.Config.Image}}' "$app_container")"
          if [ -z "$production_dir" ] || [ ! -d "$production_dir" ]; then
            echo "Could not resolve the Sistem Absensi project directory from its container."
            exit 1
          fi
          if [ -z "$config_files" ] || [ "$app_image" != "deploy-main:local" ]; then
            echo "The Sistem Absensi Compose configuration could not be resolved."
            exit 1
          fi
          if ! sudo -n true; then
            echo "Non-interactive sudo is required to read the protected production Compose configuration."
            exit 1
          fi
          compose=(sudo -n docker compose -p followme-app --project-directory "$production_dir")
          IFS=',' read -r -a config_paths <<< "$config_files"
          for config_path in "${config_paths[@]}"; do
            case "$config_path" in
              "$production_dir"/*) ;;
              *)
                echo "A Compose config resolves outside the Sistem Absensi checkout."
                exit 1
                ;;
            esac
            if [ ! -f "$config_path" ]; then
              echo "A configured Sistem Absensi Compose file is missing."
              exit 1
            fi
            compose+=(-f "$config_path")
          done

          services="$("${compose[@]}" config --services)"
          if ! grep -Fxq app <<< "$services"; then
            echo "The production Compose configuration does not define the app service."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null; then
            echo "The existing Sistem Absensi health check failed; refusing deployment."
            exit 1
          fi

          echo "Verified one healthy followme-app app container at 127.0.0.1:8081. No production changes made."
          REMOTE

      - name: Build release image from the validated main source
        run: docker build --tag "$RELEASE_IMAGE" .

      - name: Transfer the release image without changing running containers
        run: |
          docker save "$RELEASE_IMAGE" | ssh \
            -i "$HOME/.ssh/production" \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" 'docker load'

      - name: Replace only the app service and verify rollback path
        run: |
          ssh \
            -i "$HOME/.ssh/production" \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "RELEASE_IMAGE=$RELEASE_IMAGE ROLLBACK_TAG=$ROLLBACK_TAG bash -se" <<'REMOTE'
          set -Eeuo pipefail

          if [[ ! "$RELEASE_IMAGE" =~ ^deploy-main:release-[a-f0-9]+$ ]]; then
            echo "Invalid release image identifier."
            exit 1
          fi
          if [[ ! "$ROLLBACK_TAG" =~ ^deploy-main:rollback-[0-9]+$ ]]; then
            echo "Invalid rollback image identifier."
            exit 1
          fi
          app_container_ids="$(docker ps \
            --filter publish=8081 \
            --filter label=com.docker.compose.project=followme-app \
            --filter label=com.docker.compose.service=app \
            --format '{{.ID}}')"
          if [ "$(printf '%s\n' "$app_container_ids" | sed '/^$/d' | wc -l | tr -d '[:space:]')" != "1" ]; then
            echo "Production app target changed after preflight; refusing deployment."
            exit 1
          fi
          app_container="$app_container_ids"
          if [ "$(docker port "$app_container" 80/tcp)" != "127.0.0.1:8081" ]; then
            echo "Production app port binding changed after preflight; refusing deployment."
            exit 1
          fi

          production_dir="$(docker inspect --format='{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$app_container")"
          config_files="$(docker inspect --format='{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$app_container")"
          app_image="$(docker inspect --format='{{.Config.Image}}' "$app_container")"
          previous_image="$(docker inspect --format='{{.Image}}' "$app_container")"
          if [ -z "$production_dir" ] || [ ! -d "$production_dir" ] ||
            [ -z "$config_files" ] || [ "$app_image" != "deploy-main:local" ]; then
            echo "Production app metadata changed or does not match the expected service."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null; then
            echo "Production app is not healthy immediately before deployment; refusing."
            exit 1
          fi

          if ! sudo -n true; then
            echo "Non-interactive sudo is required to read the protected production Compose configuration."
            exit 1
          fi
          compose=(sudo -n docker compose -p followme-app --project-directory "$production_dir")
          IFS=',' read -r -a config_paths <<< "$config_files"
          for config_path in "${config_paths[@]}"; do
            case "$config_path" in
              "$production_dir"/*) ;;
              *)
                echo "A production Compose config resolves outside the app project."
                exit 1
                ;;
            esac
            if [ ! -f "$config_path" ]; then
              echo "A production Compose config file is missing; refusing deployment."
              exit 1
            fi
            compose+=(-f "$config_path")
          done
          services="$("${compose[@]}" config --services)"
          if ! grep -Fxq app <<< "$services"; then
            echo "Production Compose configuration does not define app."
            exit 1
          fi
          if ! docker image inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            echo "The validated release image was not transferred successfully."
            exit 1
          fi

          release_image_id="$(docker image inspect --format='{{.Id}}' "$RELEASE_IMAGE")"
          rollback_tag="$ROLLBACK_TAG"
          docker tag "$previous_image" "$rollback_tag"
          docker tag "$RELEASE_IMAGE" deploy-main:local

          restore_previous_app() {
            docker tag "$previous_image" deploy-main:local
            if ! "${compose[@]}" up -d --no-deps --no-build app; then
              echo "Rollback could not restart the previous app image."
              return 1
            fi
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null; then
                echo "Previous app image restored and healthy."
                return 0
              fi
              sleep 2
            done
            echo "Previous app image was restored, but its health check did not recover."
            return 1
          }

          if ! "${compose[@]}" up -d --no-deps --no-build app; then
            echo "App replacement failed; restoring the previous image."
            restore_previous_app
            exit 1
          fi
          for attempt in $(seq 1 30); do
            running_ids="$(docker ps \
              --filter publish=8081 \
              --filter label=com.docker.compose.project=followme-app \
              --filter label=com.docker.compose.service=app \
              --format '{{.ID}}')"
            if [ "$(printf '%s\n' "$running_ids" | sed '/^$/d' | wc -l | tr -d '[:space:]')" = "1" ] &&
              [ "$(docker inspect --format='{{.Image}}' "$running_ids")" = "$release_image_id" ] &&
              curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null; then
              echo "Sistem Absensi app release is healthy. Previous image retained as $rollback_tag."
              exit 0
            fi
            sleep 2
          done

          echo "New app health verification failed; restoring the previous image."
          restore_previous_app
          exit 1
          REMOTE
