name: Validate

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build production assets
        run: npm run build

      - name: Run application tests
        run: composer test

      - name: Check PHP formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse

      - name: Verify Laravel production caches
        run: php artisan optimize

      - name: Build production container
        run: docker build --tag deploy-main:${{ github.sha }} .

      - name: Package production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: docker save deploy-main:${{ github.sha }} | gzip > /tmp/deploy-main-${{ github.sha }}.tar.gz

      - name: Upload production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-main-image-${{ github.sha }}
          path: /tmp/deploy-main-${{ github.sha }}.tar.gz
          retention-days: 1

  deploy-production:
    name: deploy-production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    concurrency:
      group: sistem-absensi-production
      cancel-in-progress: false
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}

    steps:
      - name: Validate deployment configuration
        run: |
          missing=0
          if [ -z "$PRODUCTION_HOST" ]; then echo "Missing PRODUCTION_HOST"; missing=1; fi
          if [ -z "$PRODUCTION_USER" ]; then echo "Missing PRODUCTION_USER"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_PORT" ]; then echo "Missing PRODUCTION_SSH_PORT"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_KEY" ]; then echo "Missing PRODUCTION_SSH_KEY"; missing=1; fi
          if [ -z "$PRODUCTION_KNOWN_HOSTS" ]; then echo "Missing PRODUCTION_KNOWN_HOSTS"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "PRODUCTION_SSH_PORT must be numeric."
            exit 1
          fi

      - name: Download production image
        uses: actions/download-artifact@v4
        with:
          name: deploy-main-image-${{ github.sha }}
          path: release-image

      - name: Configure SSH
        run: |
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/production" "$HOME/.ssh/known_hosts"

      - name: Copy image to Sistem Absensi server
        run: |
          scp \
            -i "$HOME/.ssh/production" \
            -P "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "release-image/deploy-main-${{ github.sha }}.tar.gz" \
            "$PRODUCTION_USER@$PRODUCTION_HOST:/tmp/deploy-main-${{ github.sha }}.tar.gz"

      - name: Deploy app service and verify health
        run: |
          ssh \
            -i "$HOME/.ssh/production" \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          release='${{ github.sha }}'
          archive="/tmp/deploy-main-${release}.tar.gz"
          trap 'rm -f -- "$archive"' EXIT
          compose_base=(sudo -n docker compose -p followme-app
            -f /home/deploy/app/compose.yaml
            -f /home/deploy/app/compose.override.yaml)
          app_container="$("${compose_base[@]}" ps -q app)"
          queue_container="$("${compose_base[@]}" ps -q queue)"
          if [ -z "$app_container" ] || [ -z "$queue_container" ]; then
            echo "Sistem Absensi app or queue container was not found; refusing deployment."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8081/up >/dev/null; then
            echo "Current Sistem Absensi health check failed; refusing deployment."
            exit 1
          fi
          if [ "$(sudo -n docker inspect --format='{{.State.Running}}' "$queue_container")" != "true" ]; then
            echo "Current Sistem Absensi queue worker is not running; refusing deployment."
            exit 1
          fi

          previous_app_image="$(sudo -n docker inspect --format='{{.Image}}' "$app_container")"
          previous_queue_image="$(sudo -n docker inspect --format='{{.Image}}' "$queue_container")"
          sudo -n docker tag "$previous_app_image" "deploy-main:rollback-app-${release}"
          sudo -n docker tag "$previous_queue_image" "deploy-main:rollback-queue-${release}"
          sudo -n docker load --input "$archive"
          sudo -n docker tag "deploy-main:${release}" deploy-main:local

          runtime_override="$(mktemp /tmp/sistem-absensi-release-XXXXXX.yaml)"
          trap 'rm -f -- "$archive" "$runtime_override"' EXIT
          chmod 600 "$runtime_override"
          cat > "$runtime_override" <<'COMPOSE'
          services:
            app:
              volumes:
                - /home/deploy/app/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
            queue:
              volumes:
                - /home/deploy/app/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
          COMPOSE
          compose=("${compose_base[@]}" -f "$runtime_override")

          echo "Checking Firebase service-account configuration without displaying credentials."
          if ! "${compose[@]}" run --rm --no-deps app php scripts/verify-firebase-credentials.php; then
            echo "Firebase configuration is unavailable or invalid; refusing push deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi

          backup_dir=/home/deploy/app/predeploy-backups
          backup_key="$backup_dir/${release}.key"
          backup_run="${release}-${{ github.run_id }}-${{ github.run_attempt }}"
          if ! [[ "$backup_run" =~ ^[[:xdigit:]]{40}-[0-9]+-[0-9]+$ ]]; then
            echo "Invalid production backup run identifier; refusing deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi
          if ! sudo -n install -d -o root -g root -m 700 "$backup_dir"; then
            echo "Unable to prepare persistent production backup storage."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi
          if ! sudo -n test -s "$backup_key"; then
            if ! sudo -n openssl rand -hex 32 | sudo -n tee "$backup_key" >/dev/null ||
              ! sudo -n chmod 600 "$backup_key"; then
              echo "Unable to create the production backup encryption key."
              sudo -n docker tag "$previous_app_image" deploy-main:local
              exit 1
            fi
          fi

          echo "Creating and verifying an encrypted database backup on persistent Sistem Absensi host storage."
          if ! backup_output="$("${compose[@]}" run --rm --no-deps \
            --volume "$backup_dir:/predeploy-backups" \
            --volume "$backup_key:/run/predeploy-backup-key:ro" \
            --env BACKUP_DESTINATION_DISKS=predeploy_backup \
            --env BACKUP_ARCHIVE_PASSWORD_FILE=/run/predeploy-backup-key \
            --env "PREDEPLOY_BACKUP_ROOT=/predeploy-backups/$backup_run" \
            app php artisan backup:run --only-db --disable-notifications --no-interaction --no-ansi 2>&1)"; then
            printf '%s\n' "$backup_output"
            echo "Persistent encrypted production backup failed verification; refusing migration and deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi
          echo "Database backup command completed; verifying the encrypted SQL archive."

          if ! "${compose[@]}" run --rm --no-deps \
            --volume "$backup_dir:/predeploy-backups" \
            --volume "$backup_key:/run/predeploy-backup-key:ro" \
            --env "PREDEPLOY_BACKUP_ROOT=/predeploy-backups/$backup_run" \
            --env BACKUP_ARCHIVE_PASSWORD_FILE=/run/predeploy-backup-key \
            app php scripts/verify-encrypted-backup.php; then
            echo "Persistent encrypted production backup failed verification; refusing migration and deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi

          if ! "${compose[@]}" run --rm --no-deps app php artisan migrate --force --no-interaction; then
            echo "Production database migration failed; application services were not changed."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi

          rollback() {
            rollback_failed=0
            if ! sudo -n docker tag "$previous_app_image" deploy-main:local ||
              ! "${compose[@]}" up -d --no-deps --no-build app; then
              echo "Failed to restore the previous app service."
              rollback_failed=1
            fi
            if ! sudo -n docker tag "$previous_queue_image" deploy-main:local ||
              ! "${compose[@]}" up -d --no-deps --no-build queue; then
              echo "Failed to restore the previous queue service."
              rollback_failed=1
            fi
            if [ "$rollback_failed" -ne 0 ]; then
              return 1
            fi

            for attempt in $(seq 1 30); do
              restored_queue="$("${compose[@]}" ps -q queue)"
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null &&
                [ -n "$restored_queue" ] &&
                [ "$(sudo -n docker inspect --format='{{.State.Running}}' "$restored_queue")" = "true" ]; then
                echo "Previous app and queue images restored; app is healthy and queue is running."
                return 0
              fi
              sleep 2
            done
            echo "Previous app or queue image was restored, but health verification failed."
            return 1
          }

          if ! "${compose[@]}" up -d --no-deps --no-build app queue; then
            rollback
            exit 1
          fi

          for attempt in $(seq 1 30); do
            current_queue="$("${compose[@]}" ps -q queue)"
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null &&
              [ -n "$current_queue" ] &&
              [ "$(sudo -n docker inspect --format='{{.State.Running}}' "$current_queue")" = "true" ]; then
              echo "Sistem Absensi app health check passed and queue worker is running."
              exit 0
            fi
            sleep 2
          done

          if ! rollback; then
            exit 1
          fi
          exit 1
          REMOTE
