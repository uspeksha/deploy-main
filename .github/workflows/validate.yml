name: Validate

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build production assets
        run: npm run build

      - name: Run application tests
        run: composer test

      - name: Check PHP formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse

      - name: Verify Laravel production caches
        run: php artisan optimize

      - name: Build production container
        run: docker build --tag deploy-main:${{ github.sha }} .

      - name: Package production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: docker save deploy-main:${{ github.sha }} | gzip > /tmp/deploy-main-${{ github.sha }}.tar.gz

      - name: Upload production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-main-image-${{ github.sha }}
          path: /tmp/deploy-main-${{ github.sha }}.tar.gz
          retention-days: 1

  deploy-production:
    name: deploy-production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    concurrency:
      group: sistem-absensi-production
      cancel-in-progress: false
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      ATTENDANCE_GEOFENCE_BYPASS_EMAILS: ${{ secrets.ATTENDANCE_GEOFENCE_BYPASS_EMAILS }}
      MOBILE_RELEASE_TAG: ${{ vars.MOBILE_RELEASE_TAG }}

    steps:
      - name: Validate deployment configuration
        run: |
          missing=0
          if [ -z "$PRODUCTION_HOST" ]; then echo "Missing PRODUCTION_HOST"; missing=1; fi
          if [ -z "$PRODUCTION_USER" ]; then echo "Missing PRODUCTION_USER"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_PORT" ]; then echo "Missing PRODUCTION_SSH_PORT"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_KEY" ]; then echo "Missing PRODUCTION_SSH_KEY"; missing=1; fi
          if [ -z "$PRODUCTION_KNOWN_HOSTS" ]; then echo "Missing PRODUCTION_KNOWN_HOSTS"; missing=1; fi
          if [ -z "$MOBILE_RELEASE_TAG" ]; then echo "Missing mobile release tag"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "PRODUCTION_SSH_PORT must be numeric."
            exit 1
          fi
          if [ -n "$ATTENDANCE_GEOFENCE_BYPASS_EMAILS" ] &&
            ! [[ "$ATTENDANCE_GEOFENCE_BYPASS_EMAILS" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "The tester allowlist must contain one valid email address."
            exit 1
          fi
          if ! [[ "$MOBILE_RELEASE_TAG" =~ ^followme-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "MOBILE_RELEASE_TAG has an invalid format."
            exit 1
          fi

      - name: Download production image
        uses: actions/download-artifact@v4
        with:
          name: deploy-main-image-${{ github.sha }}
          path: release-image

      - name: Configure SSH
        run: |
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/production" "$HOME/.ssh/known_hosts"

      - name: Download and verify signed mobile release
        run: |
          set -euo pipefail
          mkdir -m 700 mobile-release
          curl --fail --location --retry 3 \
            "https://github.com/Labibluthfi11/followme/releases/download/${MOBILE_RELEASE_TAG}/followme-latest.apk" \
            --output mobile-release/followme-latest.apk
          curl --fail --location --retry 3 \
            "https://github.com/Labibluthfi11/followme/releases/download/${MOBILE_RELEASE_TAG}/update.json" \
            --output mobile-release/update.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["MOBILE_RELEASE_TAG"]
          manifest = json.loads(Path("mobile-release/update.json").read_text())
          expected_tag = f"followme-v{manifest['version']}-{manifest['build_number']}"
          if tag != expected_tag:
              raise SystemExit("Mobile release tag and update manifest do not match.")
          if manifest["download_url"] != (
              "https://sistemabsensi.followme.id/releases/followme-latest.apk"
              f"?release={manifest['version']}-{manifest['build_number']}"
          ):
              raise SystemExit("Mobile release manifest has an unexpected download URL.")
          if not re.fullmatch(r"[0-9a-f]{64}", __import__("hashlib").sha256(
              Path("mobile-release/followme-latest.apk").read_bytes()
          ).hexdigest()):
              raise SystemExit("Unable to verify the downloaded mobile APK.")
          PY
          printf 'ATTENDANCE_GEOFENCE_BYPASS_EMAILS=%s\n' \
            "$ATTENDANCE_GEOFENCE_BYPASS_EMAILS" > mobile-release/geofence-test.env
          chmod 600 mobile-release/geofence-test.env

      - name: Copy image to Sistem Absensi server
        run: |
          scp \
            -i "$HOME/.ssh/production" \
            -P "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "release-image/deploy-main-${{ github.sha }}.tar.gz" \
            mobile-release/followme-latest.apk \
            mobile-release/update.json \
            mobile-release/geofence-test.env \
            "$PRODUCTION_USER@$PRODUCTION_HOST:/tmp/"

      - name: Deploy app service and verify health
        run: |
          ssh \
            -i "$HOME/.ssh/production" \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          release='${{ github.sha }}'
          archive="/tmp/deploy-main-${release}.tar.gz"
          mobile_apk="/tmp/followme-latest.apk"
          mobile_manifest="/tmp/update.json"
          bypass_env_source="/tmp/geofence-test.env"
          release_dir=/home/deploy/app/releases
          bypass_env_file=/home/deploy/app/secrets/attendance-geofence-test.env
          bypass_env_new="${bypass_env_file}.new"
          bypass_env_backup="/tmp/attendance-geofence-${release}.previous"
          old_manifest="/tmp/update-${release}.previous.json"
          old_apk="/tmp/followme-${release}.previous.apk"
          served_apk="/tmp/followme-${release}.served.apk"
          served_manifest="/tmp/update-${release}.served.json"
          runtime_override=""
          cleanup() {
            local cleanup_paths=(
              "$archive" "$mobile_apk" "$mobile_manifest" "$bypass_env_source"
              "$bypass_env_backup" "$old_manifest" "$old_apk" "$served_apk"
              "$served_manifest" "$bypass_env_new"
            )
            if [ -n "$runtime_override" ]; then
              cleanup_paths+=("$runtime_override")
            fi
            sudo -n rm -f -- "${cleanup_paths[@]}" \
              "$release_dir/followme-latest.apk.new" "$release_dir/update.json.new"
          }
          trap cleanup EXIT
          chmod 600 "$bypass_env_source"
          compose_base=(sudo -n docker compose -p followme-app
            -f /home/deploy/app/compose.yaml
            -f /home/deploy/app/compose.override.yaml)
          app_container="$("${compose_base[@]}" ps -q app)"
          queue_container="$("${compose_base[@]}" ps -q queue)"
          if [ -z "$app_container" ] || [ -z "$queue_container" ]; then
            echo "Sistem Absensi app or queue container was not found; refusing deployment."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8081/up >/dev/null; then
            echo "Current Sistem Absensi health check failed; refusing deployment."
            exit 1
          fi
          if [ "$(sudo -n docker inspect --format='{{.State.Running}}' "$queue_container")" != "true" ]; then
            echo "Current Sistem Absensi queue worker is not running; refusing deployment."
            exit 1
          fi

          previous_app_image="$(sudo -n docker inspect --format='{{.Image}}' "$app_container")"
          previous_queue_image="$(sudo -n docker inspect --format='{{.Image}}' "$queue_container")"
          sudo -n docker tag "$previous_app_image" "deploy-main:rollback-app-${release}"
          sudo -n docker tag "$previous_queue_image" "deploy-main:rollback-queue-${release}"
          sudo -n docker load --input "$archive"
          sudo -n docker tag "deploy-main:${release}" deploy-main:local
          release_image_id="$(sudo -n docker image inspect --format='{{.Id}}' deploy-main:local)"

          if ! sudo -n install -d -o root -g root -m 755 "$release_dir" ||
            ! sudo -n install -d -o root -g root -m 700 /home/deploy/app/secrets; then
            echo "Unable to prepare persistent Sistem Absensi release storage."
            exit 1
          fi
          if sudo -n test -f "$bypass_env_file"; then
            sudo -n cp -- "$bypass_env_file" "$bypass_env_backup"
            sudo -n chmod 600 "$bypass_env_backup"
          else
            sudo -n install -o root -g root -m 600 /dev/null "$bypass_env_backup"
            sudo -n install -o root -g root -m 600 /dev/null "$bypass_env_file"
          fi
          if ! sudo -n test -s "$release_dir/update.json"; then
            if ! sudo -n docker cp \
              "$app_container:/var/www/html/public/update.json" \
              "$release_dir/update.json"; then
              echo "Unable to preserve the current updater manifest; refusing deployment."
              exit 1
            fi
          fi
          if ! sudo -n test -s "$release_dir/followme-latest.apk"; then
            if ! sudo -n docker cp \
              "$app_container:/var/www/html/public/releases/followme-latest.apk" \
              "$release_dir/followme-latest.apk"; then
              echo "Unable to preserve the current release APK; refusing deployment."
              exit 1
            fi
          fi

          runtime_override="$(mktemp /tmp/sistem-absensi-release-XXXXXX.yaml)"
          chmod 600 "$runtime_override"
          cat > "$runtime_override" <<'COMPOSE'
          services:
            app:
              volumes:
                - /home/deploy/app/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
                - /home/deploy/app/releases:/var/www/html/public/releases:ro
                - /home/deploy/app/releases/update.json:/var/www/html/public/update.json:ro
              env_file:
                - /home/deploy/app/secrets/attendance-geofence-test.env
            queue:
              volumes:
                - /home/deploy/app/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
          COMPOSE
          compose=("${compose_base[@]}" -f "$runtime_override")

          echo "Checking Firebase service-account configuration without displaying credentials."
          if ! "${compose[@]}" run --rm --no-deps -T app php scripts/verify-firebase-credentials.php </dev/null; then
            echo "Firebase configuration is unavailable or invalid; refusing push deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi

          backup_dir=/home/deploy/app/predeploy-backups
          backup_key="$backup_dir/${release}.key"
          backup_run="${release}-${{ github.run_id }}-${{ github.run_attempt }}"
          if ! [[ "$backup_run" =~ ^[[:xdigit:]]{40}-[0-9]+-[0-9]+$ ]]; then
            echo "Invalid production backup run identifier; refusing deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi
          if ! sudo -n install -d -o root -g root -m 700 "$backup_dir"; then
            echo "Unable to prepare persistent production backup storage."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi
          if ! sudo -n test -s "$backup_key"; then
            if ! sudo -n openssl rand -hex 32 | sudo -n tee "$backup_key" >/dev/null ||
              ! sudo -n chmod 600 "$backup_key"; then
              echo "Unable to create the production backup encryption key."
              sudo -n docker tag "$previous_app_image" deploy-main:local
              exit 1
            fi
          fi

          echo "Creating and verifying an encrypted database backup on persistent Sistem Absensi host storage."
          if ! backup_output="$("${compose[@]}" run --rm --no-deps -T \
            --volume "$backup_dir:/predeploy-backups" \
            --volume "$backup_key:/run/predeploy-backup-key:ro" \
            --env BACKUP_DESTINATION_DISKS=predeploy_backup \
            --env BACKUP_ARCHIVE_PASSWORD_FILE=/run/predeploy-backup-key \
            --env "PREDEPLOY_BACKUP_ROOT=/predeploy-backups/$backup_run" \
            app php artisan backup:run --only-db --disable-notifications --no-interaction --no-ansi 2>&1 </dev/null)"; then
            printf '%s\n' "$backup_output"
            echo "Persistent encrypted production backup failed verification; refusing migration and deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi
          echo "Database backup command completed; verifying the encrypted SQL archive."

          if ! "${compose[@]}" run --rm --no-deps -T \
            --volume "$backup_dir:/predeploy-backups" \
            --volume "$backup_key:/run/predeploy-backup-key:ro" \
            --env "PREDEPLOY_BACKUP_ROOT=/predeploy-backups/$backup_run" \
            --env BACKUP_ARCHIVE_PASSWORD_FILE=/run/predeploy-backup-key \
            app php scripts/verify-encrypted-backup.php </dev/null; then
            echo "Persistent encrypted production backup failed verification; refusing migration and deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi

          if ! "${compose[@]}" run --rm --no-deps -T app php artisan migrate --force --no-interaction </dev/null; then
            echo "Production database migration failed; application services were not changed."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi
          migration_status="$("${compose[@]}" run --rm --no-deps -T app php artisan migrate:status --no-ansi </dev/null)"
          if ! printf '%s\n' "$migration_status" |
            grep -F '2026_11_13_090000_create_fcm_devices_table' |
            grep -Fq 'Ran'; then
            echo "FCM device migration is not recorded as applied; refusing service deployment."
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi
          echo "FCM device migration is applied."

          if ! sudo -n install -o root -g root -m 600 \
            "$bypass_env_source" "$bypass_env_new" ||
            ! sudo -n mv -- "$bypass_env_new" "$bypass_env_file"; then
            echo "Unable to configure the authorized tester geofence exception."
            if ! sudo -n install -o root -g root -m 600 \
              "$bypass_env_backup" "$bypass_env_file"; then
              echo "Failed to restore the previous tester geofence configuration."
            fi
            sudo -n docker tag "$previous_app_image" deploy-main:local
            exit 1
          fi

          rollback() {
            rollback_failed=0
            if ! sudo -n install -o root -g root -m 600 \
              "$bypass_env_backup" "$bypass_env_file"; then
              echo "Failed to restore the previous tester geofence configuration."
              rollback_failed=1
            fi
            if ! sudo -n docker tag "$previous_app_image" deploy-main:local ||
              ! "${compose[@]}" up -d --no-deps --no-build app; then
              echo "Failed to restore the previous app service."
              rollback_failed=1
            fi
            if ! sudo -n docker tag "$previous_queue_image" deploy-main:local ||
              ! "${compose[@]}" up -d --no-deps --no-build queue; then
              echo "Failed to restore the previous queue service."
              rollback_failed=1
            fi
            if [ "$rollback_failed" -ne 0 ]; then
              return 1
            fi
            if ! "${compose[@]}" exec -T app php artisan optimize </dev/null; then
              echo "Failed to restore the previous app configuration cache."
              return 1
            fi

            for attempt in $(seq 1 30); do
              restored_app="$("${compose[@]}" ps -q app)"
              restored_queue="$("${compose[@]}" ps -q queue)"
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null &&
                [ -n "$restored_app" ] &&
                [ -n "$restored_queue" ] &&
                [ "$(sudo -n docker inspect --format='{{.Image}}' "$restored_app")" = "$previous_app_image" ] &&
                [ "$(sudo -n docker inspect --format='{{.Image}}' "$restored_queue")" = "$previous_queue_image" ] &&
                [ "$(sudo -n docker inspect --format='{{.State.Running}}' "$restored_queue")" = "true" ]; then
                echo "Previous app and queue images restored; app is healthy and queue is running."
                return 0
              fi
              sleep 2
            done
            echo "Previous app or queue image was restored, but health verification failed."
            return 1
          }

          if ! "${compose[@]}" up -d --no-deps --no-build app queue; then
            rollback
            exit 1
          fi

          if ! "${compose[@]}" exec -T app php artisan optimize </dev/null; then
            echo "Production application cache rebuild failed; restoring previous services."
            rollback
            exit 1
          fi

          healthy=0
          for attempt in $(seq 1 30); do
            current_app="$("${compose[@]}" ps -q app)"
            current_queue="$("${compose[@]}" ps -q queue)"
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/up >/dev/null &&
              [ -n "$current_app" ] &&
              [ -n "$current_queue" ] &&
              [ "$(sudo -n docker inspect --format='{{.Image}}' "$current_app")" = "$release_image_id" ] &&
              [ "$(sudo -n docker inspect --format='{{.Image}}' "$current_queue")" = "$release_image_id" ] &&
              [ "$(sudo -n docker inspect --format='{{.State.Running}}' "$current_queue")" = "true" ]; then
              if ! "${compose[@]}" exec -T app php scripts/verify-firebase-credentials.php </dev/null; then
                sleep 2
                continue
              fi
              echo "Sistem Absensi app health check passed and queue worker is running."
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Deployment health check failed; restoring previous services."
            rollback
            exit 1
          fi

          current_app="$("${compose[@]}" ps -q app)"
          if ! sudo -n cp -- "$release_dir/update.json" "$old_manifest" ||
            ! sudo -n cp -- "$release_dir/followme-latest.apk" "$old_apk"; then
            echo "Unable to snapshot the current updater files; restoring previous services."
            rollback
            exit 1
          fi
          restore_release_files() {
            local restore_failed=0
            if ! sudo -n install -o root -g root -m 644 \
              "$old_apk" "$release_dir/followme-latest.apk"; then
              echo "Failed to restore the previous updater APK."
              restore_failed=1
            fi
            if ! sudo -n install -o root -g root -m 644 \
              "$old_manifest" "$release_dir/update.json"; then
              echo "Failed to restore the previous updater manifest."
              restore_failed=1
            fi
            return "$restore_failed"
          }
          if ! sudo -n install -o root -g root -m 644 \
            "$mobile_apk" "$release_dir/followme-latest.apk.new" ||
            ! sudo -n mv -- "$release_dir/followme-latest.apk.new" "$release_dir/followme-latest.apk"; then
            echo "Unable to install the new APK; restoring previous updater files and services."
            if ! restore_release_files; then
              echo "Updater file rollback was incomplete."
            fi
            rollback
            exit 1
          fi

          apk_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["download_url"])' "$mobile_manifest")"
          apk_query="${apk_url#*\?}"
          if ! curl --fail --silent --show-error --max-time 60 \
            "http://127.0.0.1:8081/releases/followme-latest.apk?${apk_query}" \
            --output "$served_apk" ||
            ! cmp -s "$mobile_apk" "$served_apk"; then
            echo "New APK did not verify through the Sistem Absensi app; restoring previous updater files and services."
            if ! restore_release_files; then
              echo "Updater file rollback was incomplete."
            fi
            rollback
            exit 1
          fi

          if ! sudo -n install -o root -g root -m 644 \
            "$mobile_manifest" "$release_dir/update.json.new" ||
            ! sudo -n mv -- "$release_dir/update.json.new" "$release_dir/update.json"; then
            echo "Unable to publish the update manifest; restoring previous updater files and services."
            if ! restore_release_files; then
              echo "Updater file rollback was incomplete."
            fi
            rollback
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:8081/update.json \
            --output "$served_manifest" ||
            ! cmp -s "$mobile_manifest" "$served_manifest"; then
            echo "Published update manifest did not verify; restoring previous updater files and services."
            if ! restore_release_files; then
              echo "Updater file rollback was incomplete."
            fi
            rollback
            exit 1
          fi

          echo "Sistem Absensi health checks passed; signed APK and updater manifest are published."
          exit 0
          REMOTE
